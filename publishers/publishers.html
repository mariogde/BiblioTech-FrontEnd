<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editoras · BiblioTech</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="estrutura-app">

    <aside class="barra-lateral">
      <div class="barra-lateral__logo">
        <span class="barra-lateral__logo-icone" aria-hidden="true"></span>
        <span>BiblioTech</span>
      </div>

      <nav class="barra-lateral__menu" aria-label="Menu principal">
        <ul>
          <li><a href="../dashboard/dashboard.html" class="barra-lateral__link">Dashboard</a></li>
          <li><a href="../renters/renters.html" class="barra-lateral__link">Locatários</a></li>
          <li><a href="../books/books.html" class="barra-lateral__link barra-lateral__link--submenu">Livros</a></li>
          <li><a href="publishers.html" class="barra-lateral__link barra-lateral__link--submenu barra-lateral__link--ativo">Editoras</a></li>
          <li><a href="../rentals/rentals.html" class="barra-lateral__link barra-lateral__link--submenu">Aluguéis</a></li>
        </ul>
      </nav>

      <button type="button" id="botao-sair" class="barra-lateral__sair">Sair</button>
    </aside>

    <div class="area-principal">
      <header class="barra-superior">
        <div class="barra-superior__idioma-container">
          <button
            type="button"
            id="botao-idioma"
            class="barra-superior__idioma"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="idioma-selecionado">Português</span>
          </button>

          <ul id="lista-idiomas" class="barra-superior__idioma-lista" role="listbox" hidden>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Português">Português</button></li>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Espanhol">Espanhol</button></li>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Inglês">Inglês</button></li>
          </ul>
        </div>

        <button type="button" id="botao-perfil" class="barra-superior__perfil">
          <div class="barra-superior__avatar" id="avatar-usuario">?</div>
          <div class="barra-superior__info">
            <span class="barra-superior__nome" id="nome-usuario">Usuário</span>
            <span class="barra-superior__papel">Locatário</span>
          </div>
        </button>
      </header>

      <main class="conteudo">

        <section id="visao-lista" class="visao">
          <div class="conteudo-cabecalho">
            <div class="campo-busca">
              <input 
                type="search" 
                id="campo-busca" 
                class="formulario-campo" 
                placeholder="Buscar editora..." 
              />
            </div>
            <button type="button" id="botao-nova-editora" class="botao botao--escuro">Nova editora</button>
          </div>

          <div class="tabela-wrapper">
            <table class="tabela">
              <thead>
                <tr>
                  <th scope="col">Nome</th>
                  <th scope="col">E-mail</th>
                  <th scope="col">Telefone</th>
                  <th scope="col">Site</th>
                  <th scope="col"><span class="sr-only">Ações</span></th>
                </tr>
              </thead>
              <tbody id="corpo-tabela-editoras">
              </tbody>
            </table>
            <p id="tabela-vazia" class="tabela-vazia" hidden>Nenhuma editora cadastrada ainda.</p>
          </div>
        </section>

        <section id="visao-formulario" class="visao visao--centralizada" hidden>
          <div class="cartao cartao--largo">
            <h2 class="cartao__marca" id="titulo-formulario-editora">Cadastrar Editora</h2>

            <div id="retorno-editora" class="retorno" role="alert" aria-live="assertive"></div>

            <form id="formulario-editora" novalidate>
              <input type="hidden" id="editora-id" value="" />

              <div class="formulario-grupo">
                <label for="editora-nome" class="formulario-rotulo">Nome completo</label>
                <input
                  type="text"
                  id="editora-nome"
                  name="editora-nome"
                  class="formulario-campo"
                  aria-describedby="erro-editora-nome"
                  required
                />
                <span id="erro-editora-nome" class="formulario-erro"></span>
              </div>

              <div class="formulario-linha">
                <div class="formulario-grupo">
                  <label for="editora-email" class="formulario-rotulo">E-mail</label>
                  <input
                    type="email"
                    id="editora-email"
                    name="editora-email"
                    class="formulario-campo"
                    aria-describedby="erro-editora-email"
                    required
                  />
                  <span id="erro-editora-email" class="formulario-erro"></span>
                </div>

                <div class="formulario-grupo">
                  <label for="editora-telefone" class="formulario-rotulo">Telefone</label>
                  <input
                    type="tel"
                    id="editora-telefone"
                    name="editora-telefone"
                    class="formulario-campo"
                    inputmode="numeric"
                    placeholder="(00) 0000-0000"
                    maxlength="15"
                    aria-describedby="erro-editora-telefone"
                    required
                  />
                  <span id="erro-editora-telefone" class="formulario-erro"></span>
                </div>
              </div>

              <div class="formulario-grupo">
                <label for="editora-site" class="formulario-rotulo">Site</label>
                <input
                  type="text"
                  id="editora-site"
                  name="editora-site"
                  class="formulario-campo"
                  placeholder="exemplo.com"
                  aria-describedby="erro-editora-site"
                />
                <span id="erro-editora-site" class="formulario-erro"></span>
              </div>

              <div class="botao-grupo">
                <button type="button" id="botao-cancelar-editora" class="botao botao--secundario">Cancelar</button>
                <button type="submit" id="botao-confirmar-editora" class="botao botao--primario">Confirmar</button>
              </div>
            </form>
          </div>
        </section>

      </main>
    </div>

  </div>

  <script src="publishers.js"></script>
</body>
</html>
