<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha · BiblioTech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="pagina-autenticacao">

  <main class="cartao">
    <h1 class="cartao__marca">BiblioTech</h1>

    <div id="retorno-recuperacao" class="retorno" role="alert" aria-live="assertive"></div>

    <!-- Etapa 1: identificação do usuário (e-mail + CPF) -->
    <section id="etapa-identificacao" class="etapa">
      <p class="cartao__subtitulo">Recuperar Senha de acesso</p>

      <form id="formulario-identificacao" novalidate>
        <div class="formulario-grupo">
          <label for="email" class="formulario-rotulo">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            class="formulario-campo"
            autocomplete="username"
            aria-describedby="erro-email"
            required
          />
          <span id="erro-email" class="formulario-erro"></span>
        </div>

        <div class="formulario-grupo">
          <label for="cpf" class="formulario-rotulo">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            class="formulario-campo"
            inputmode="numeric"
            placeholder="000.000.000-00"
            maxlength="14"
            aria-describedby="erro-cpf"
            required
          />
          <span id="erro-cpf" class="formulario-erro"></span>
        </div>

        <div class="botao-grupo">
          <button type="button" id="botao-cancelar-identificacao" class="botao botao--secundario">Cancelar</button>
          <button type="submit" id="botao-confirmar-identificacao" class="botao botao--primario">Confirmar</button>
        </div>
      </form>
    </section>

    <!-- Etapa 2: definição da nova senha (exibida após identificação confirmada) -->
    <section id="etapa-nova-senha" class="etapa" hidden>
      <p class="cartao__subtitulo" id="subtitulo-nova-senha">Recuperar Senha de acesso</p>

      <form id="formulario-nova-senha" novalidate>
        <div class="formulario-grupo">
          <label for="nova-senha" class="formulario-rotulo">Nova senha</label>
          <input
            type="password"
            id="nova-senha"
            name="nova-senha"
            class="formulario-campo"
            autocomplete="new-password"
            aria-describedby="erro-nova-senha"
            required
          />
          <span id="erro-nova-senha" class="formulario-erro"></span>
        </div>

        <div class="formulario-grupo">
          <label for="confirmar-nova-senha" class="formulario-rotulo">Confirmar senha</label>
          <input
            type="password"
            id="confirmar-nova-senha"
            name="confirmar-nova-senha"
            class="formulario-campo"
            autocomplete="new-password"
            aria-describedby="erro-confirmar-nova-senha"
            required
          />
          <span id="erro-confirmar-nova-senha" class="formulario-erro"></span>
        </div>

        <div class="botao-grupo">
          <button type="button" id="botao-cancelar-nova-senha" class="botao botao--secundario">Cancelar</button>
          <button type="submit" id="botao-confirmar-nova-senha" class="botao botao--primario">Confirmar</button>
        </div>
      </form>
    </section>

    <nav class="cartao__links" aria-label="Ações da conta">
      <a href="index.html">Voltar para o login</a>
    </nav>
  </main>

  <script src="js/forgot-password.js"></script>
</body>
</html>
