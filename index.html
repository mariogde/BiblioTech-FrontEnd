<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar · BiblioTech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <main class="login-card">
    <h1 class="login-card__brand">BiblioTech</h1>

    <div id="login-feedback" class="login-feedback" role="alert" aria-live="assertive"></div>

    <form id="login-form" class="login-form" novalidate>
      <div class="login-form__group">
        <label for="email" class="login-form__label">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          class="login-form__input"
          autocomplete="username"
          aria-describedby="email-error"
          required
        />
        <span id="email-error" class="login-form__error"></span>
      </div>

      <div class="login-form__group">
        <label for="password" class="login-form__label">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          class="login-form__input"
          autocomplete="current-password"
          aria-describedby="password-error"
          required
        />
        <span id="password-error" class="login-form__error"></span>
      </div>

      <button type="submit" class="login-form__submit">Entrar</button>
    </form>

    <nav class="login-card__links" aria-label="Ações da conta">
      <a href="register.html">Cadastre-se agora</a>
      <a href="forgot-password.html">Esqueci a senha</a>
    </nav>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
