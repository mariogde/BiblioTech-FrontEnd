<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar · BiblioTech</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="pagina-autenticacao">

  <main class="cartao cartao--largo">
    <h1 class="cartao__marca">BiblioTech</h1>

    <div id="retorno-cadastro" class="retorno" role="alert" aria-live="assertive"></div>

    <form id="formulario-cadastro" novalidate>
      <div class="formulario-grupo">
        <label for="nome" class="formulario-rotulo">Nome Completo</label>
        <input
          type="text"
          id="nome"
          name="nome"
          class="formulario-campo"
          autocomplete="name"
          aria-describedby="erro-nome"
          required
        />
        <span id="erro-nome" class="formulario-erro"></span>
      </div>

      <div class="formulario-grupo">
        <label for="email" class="formulario-rotulo">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          class="formulario-campo"
          autocomplete="email"
          aria-describedby="erro-email"
          required
        />
        <span id="erro-email" class="formulario-erro"></span>
      </div>

      <div class="formulario-linha">
        <div class="formulario-grupo">
          <label for="cpf" class="formulario-rotulo">CPF</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            class="formulario-campo"
            inputmode="numeric"
            placeholder="000.000.000-00"
            maxlength="14"
            aria-describedby="erro-cpf"
            required
          />
          <span id="erro-cpf" class="formulario-erro"></span>
        </div>

        <div class="formulario-grupo">
          <label for="data-nascimento" class="formulario-rotulo">Data de nascimento</label>
          <input
            type="date"
            id="data-nascimento"
            name="data-nascimento"
            class="formulario-campo"
            aria-describedby="erro-data-nascimento"
            required
          />
          <span id="erro-data-nascimento" class="formulario-erro"></span>
        </div>
      </div>

      <div class="formulario-grupo">
        <label for="telefone" class="formulario-rotulo">Telefone</label>
        <input
          type="tel"
          id="telefone"
          name="telefone"
          class="formulario-campo"
          inputmode="numeric"
          placeholder="(00) 00000-0000"
          maxlength="15"
          aria-describedby="erro-telefone"
          required
        />
        <span id="erro-telefone" class="formulario-erro"></span>
      </div>

      <div class="formulario-linha">
        <div class="formulario-grupo">
          <label for="senha" class="formulario-rotulo">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            class="formulario-campo"
            autocomplete="new-password"
            aria-describedby="erro-senha"
            required
          />
          <span id="erro-senha" class="formulario-erro"></span>
        </div>

        <div class="formulario-grupo">
          <label for="confirmar-senha" class="formulario-rotulo">Confirmar Senha</label>
          <input
            type="password"
            id="confirmar-senha"
            name="confirmar-senha"
            class="formulario-campo"
            autocomplete="new-password"
            aria-describedby="erro-confirmar-senha"
            required
          />
          <span id="erro-confirmar-senha" class="formulario-erro"></span>
        </div>
      </div>

      <div class="botao-grupo">
        <button type="button" id="botao-cancelar-cadastro" class="botao botao--secundario">Cancelar</button>
        <button type="submit" id="botao-cadastrar" class="botao botao--primario">Cadastrar</button>
      </div>
    </form>
  </main>

  <script src="js/register.js"></script>
</body>
</html>
