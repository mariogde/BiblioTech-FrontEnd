<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aluguéis · BiblioTech</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div class="estrutura-app">

    <aside class="barra-lateral">
      <div class="barra-lateral__logo">
        <span class="barra-lateral__logo-icone" aria-hidden="true"></span>
        <span>BiblioTech</span>
      </div>

      <nav class="barra-lateral__menu" aria-label="Menu principal">
        <ul>
          <li><a href="../dashboard/dashboard.html" class="barra-lateral__link">Dashboard</a></li>
          <li><a href="../renters/renters.html" class="barra-lateral__link">Locatários</a></li>
          <li><a href="../books/books.html" class="barra-lateral__link barra-lateral__link--submenu">Livros</a></li>
          <li><a href="../publishers/publishers.html" class="barra-lateral__link barra-lateral__link--submenu">Editoras</a></li>
          <li><a href="rentals.html" class="barra-lateral__link barra-lateral__link--submenu barra-lateral__link--ativo">Aluguéis</a></li>
        </ul>
      </nav>

      <button type="button" id="botao-sair" class="barra-lateral__sair">Sair</button>
    </aside>

    <div class="area-principal">
      <header class="barra-superior">
        <div class="barra-superior__idioma-container">
          <button
            type="button"
            id="botao-idioma"
            class="barra-superior__idioma"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span id="idioma-selecionado">Português</span>
          </button>

          <ul id="lista-idiomas" class="barra-superior__idioma-lista" role="listbox" hidden>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Português">Português</button></li>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Espanhol">Espanhol</button></li>
            <li role="option"><button type="button" class="barra-superior__idioma-opcao" data-idioma="Inglês">Inglês</button></li>
          </ul>
        </div>

        <button type="button" id="botao-perfil" class="barra-superior__perfil">
          <div class="barra-superior__avatar" id="avatar-usuario">?</div>
          <div class="barra-superior__info">
            <span class="barra-superior__nome" id="nome-usuario">Usuário</span>
            <span class="barra-superior__papel">Locatário</span>
          </div>
        </button>
      </header>

      <main class="conteudo">

        <section id="visao-lista" class="visao">
          <div class="conteudo-cabecalho">
            <div class="campo-busca">
              <input 
                type="search" 
                id="campo-busca" 
                class="formulario-campo" 
                placeholder="Buscar por locatário ou livro..." 
              />
            </div>
            <button type="button" id="botao-novo-aluguel" class="botao botao--escuro">Novo Aluguel</button>
          </div>

          <div class="tabela-wrapper">
            <div class="tabela-cabecalho-texto">
              <h2 class="tabela-titulo">Histórico de aluguéis</h2>
              <p class="tabela-subtitulo">Registros de aluguel são definitivos e não podem ser editados ou excluídos.</p>
            </div>

            <table class="tabela">
              <thead>
                <tr>
                  <th scope="col">Locatário</th>
                  <th scope="col">Livro</th>
                  <th scope="col">Data do aluguel</th>
                  <th scope="col">Devolução prevista</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="corpo-tabela-alugueis">
                <!-- Linhas geradas dinamicamente via rentals.js -->
              </tbody>
            </table>
            <p id="tabela-vazia" class="tabela-vazia" hidden>Nenhum aluguel registrado ainda.</p>
          </div>
        </section>

        <section id="visao-formulario" class="visao visao--centralizada" hidden>
          <div class="cartao cartao--largo">
            <h2 class="cartao__marca">Cadastro de aluguel</h2>

            <div id="retorno-aluguel" class="retorno" role="alert" aria-live="assertive"></div>

            <form id="formulario-aluguel" novalidate>
              <div class="formulario-grupo">
                <label for="aluguel-locatario" class="formulario-rotulo">Locatário</label>
                <select
                  id="aluguel-locatario"
                  name="aluguel-locatario"
                  class="formulario-campo"
                  aria-describedby="erro-aluguel-locatario"
                  required
                >
                  <option value="">Selecione um locatário</option>
                </select>
                <span id="erro-aluguel-locatario" class="formulario-erro"></span>
              </div>

              <div class="formulario-linha">
                <div class="formulario-grupo">
                  <label for="aluguel-livro" class="formulario-rotulo">Livro</label>
                  <select
                    id="aluguel-livro"
                    name="aluguel-livro"
                    class="formulario-campo"
                    aria-describedby="erro-aluguel-livro"
                    required
                  >
                    <option value="">Selecione um livro</option>
                  </select>
                  <span id="erro-aluguel-livro" class="formulario-erro"></span>
                </div>

                <div class="formulario-grupo">
                  <label for="aluguel-data" class="formulario-rotulo">Data do aluguel</label>
                  <input
                    type="date"
                    id="aluguel-data"
                    name="aluguel-data"
                    class="formulario-campo"
                    aria-describedby="erro-aluguel-data"
                    required
                  />
                  <span id="erro-aluguel-data" class="formulario-erro"></span>
                </div>
              </div>

              <div class="formulario-linha">
                <div class="formulario-grupo">
                  <label for="aluguel-devolucao" class="formulario-rotulo">Devolução prevista</label>
                  <input
                    type="date"
                    id="aluguel-devolucao"
                    name="aluguel-devolucao"
                    class="formulario-campo"
                    aria-describedby="erro-aluguel-devolucao"
                    required
                  />
                  <span id="erro-aluguel-devolucao" class="formulario-erro"></span>
                </div>

                <div class="formulario-grupo">
                  <label for="aluguel-status" class="formulario-rotulo">Status</label>
                  <select
                    id="aluguel-status"
                    name="aluguel-status"
                    class="formulario-campo"
                    aria-describedby="erro-aluguel-status"
                    required
                  >
                    <option value="Alugado">Alugado</option>
                    <option value="Entregue no prazo">Entregue no prazo</option>
                  </select>
                  <span id="erro-aluguel-status" class="formulario-erro"></span>
                </div>
              </div>

              <div class="botao-grupo">
                <button type="button" id="botao-cancelar-aluguel" class="botao botao--secundario">Cancelar</button>
                <button type="submit" id="botao-confirmar-aluguel" class="botao botao--primario">Confirmar</button>
              </div>
            </form>
          </div>
        </section>

      </main>
    </div>

  </div>

  <script src="rentals.js"></script>
</body>
</html>
